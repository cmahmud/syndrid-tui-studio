name: Release v0.6.0 Windows Desktop App

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 installer for v0.6.0
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build and publish Windows installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v0.6.0
          releaseName: 'Syndrid TUI Studio v0.6.0'
          releaseBody: |
            Windows x64 release of Syndrid TUI Studio v0.6.0.

            Includes the Ratatui ecosystem integration, native PTY preview, local image preview, first-class ecosystem components, MCP adapter tooling, and expanded production export/runtime support.

            Download the `-setup.exe` asset below and run it to install the app.
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          retryAttempts: 2
          args: '--bundles nsis'
          releaseAssetNamePattern: 'Syndrid-TUI-Studio_[version]_[arch][setup][ext]'
          uploadUpdaterJson: false
