name: Bootstrap terminal runtime integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: reconcile dependencies and apply compatible audit repairs
        run: |
          npm install --package-lock-only
          npm audit fix --package-lock-only
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: install real xterm terminal surface
        run: cp scripts/bootstrap/TerminalTestModal.tsx src/components/editor/TerminalTestModal.tsx
      - run: npm run lint
      - name: refresh intentional integer-terminal-layout snapshots
        run: npm test -- -u
      - run: npm run build
      - run: npm run verify:syndrid
      - name: restore permanent read-only CI and remove bootstrap scaffolding
        run: |
          cp scripts/bootstrap/ci-final.yml .github/workflows/ci.yml
          rm -f .github/workflows/bootstrap-terminal-runtime.yml
          rm -rf scripts/bootstrap
      - name: commit bootstrap results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No bootstrap changes to commit."
            exit 0
          fi
          git commit -m "chore: finalize audited terminal runtime integration"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
