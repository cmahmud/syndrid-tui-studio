name: Release Windows Desktop App

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Reject high-severity production dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Structural verification
        run: npm run verify:syndrid

      - name: Build frontend
        run: npm run build

      - name: Build release terminal-preview sidecar
        run: npm run prepare:preview-sidecar:release

      - name: Verify Windows desktop and sidecar linkage
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Build and publish Windows installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v0.6.1
          releaseName: 'Syndrid TUI Studio v0.6.1'
          releaseBody: |
            Windows x64 release of Syndrid TUI Studio v0.6.1.

            This release includes the Studio hardening pass and real Terminal Test Mode: canonical `.tui` v3/TachyonFX handling, responsive/layout correctness fixes, deterministic mock scenarios, native Ratatui + TachyonFX execution through PTY/ConPTY, xterm terminal emulation, MCP bridge hardening, and expanded CI/security coverage.

            Download the `-setup.exe` asset below and run it to install the app.
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          retryAttempts: 2
          args: '--bundles nsis'
          releaseAssetNamePattern: 'Syndrid-TUI-Studio_[version]_[arch][setup][ext]'
          uploadUpdaterJson: false
