name: Converge, validate and merge Studio hardening

on:
  push:
    branches:
      - 'agent/studio-hardening-terminal-test-runtime'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: studio-hardening-converge-validate
  cancel-in-progress: true

env:
  BRANCH: agent/studio-hardening-terminal-test-runtime
  PR_NUMBER: '5'

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: converge source and package layout
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          package = Path('package.json')
          data = json.loads(package.read_text())
          data.setdefault('dependencies', {})['@xterm/xterm'] = '^5.5.0'
          data['scripts']['prepare:preview-sidecar'] = 'node scripts/prepare-preview-sidecar-v3.mjs'
          data['scripts']['prepare:preview-sidecar:release'] = 'node scripts/prepare-preview-sidecar-v3.mjs --release'
          data['scripts']['mcp-server'] = 'node --import ./mcp-server/bridge-auth-preload.mjs ./mcp-server/index.mjs'
          package.write_text(json.dumps(data, indent=2) + '\n')

          verifier = Path('scripts/verify-syndrid.mjs')
          text = verifier.read_text()
          text = text.replace("'src-tauri/src/bin/syndrid-tui-preview.rs'", "'rust/syndrid-ratatui-runtime/src/bin/syndrid-tui-preview.rs'")
          text = text.replace("'scripts/prepare-preview-sidecar-v2.mjs'", "'scripts/prepare-preview-sidecar-v3.mjs'")
          verifier.write_text(text)
          PY
          rm -f src-tauri/src/bin/syndrid-tui-preview.rs scripts/prepare-preview-sidecar-v2.mjs
          if [ -f scripts/bootstrap/TerminalTestModal.tsx ]; then
            cp scripts/bootstrap/TerminalTestModal.tsx src/components/editor/TerminalTestModal.tsx
          fi

      - name: normalize native preview runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('rust/syndrid-ratatui-runtime/src/preview.rs')
          text = path.read_text()
          text = text.replace('#[derive(Debug)]\nstruct RuntimeState {', 'struct RuntimeState {')
          old = '''            let items = values.unwrap_or(&Vec::new()).iter().enumerate().map(|(item_index, value)| {
                let prefix = if item_index == selected { "› " } else { "  " };
                ListItem::new(format!("{prefix}{}", object_label(value)))
            }).collect::<Vec<_>>();'''
          new = '''            let empty_values = Vec::new();
            let source_values = values.unwrap_or(&empty_values);
            let items = source_values.iter().enumerate().map(|(item_index, value)| {
                let prefix = if item_index == selected { "› " } else { "  " };
                ListItem::new(format!("{prefix}{}", object_label(value)))
            }).collect::<Vec<_>>();'''
          text = text.replace(old, new)
          path.write_text(text)
          PY
          cargo fmt --manifest-path rust/syndrid-ratatui-runtime/Cargo.toml

      - name: reconcile lockfile and production audit
        run: |
          npm install --package-lock-only
          npm audit fix --package-lock-only
          npm ci
          npm audit --omit=dev --audit-level=high

      - name: frontend and native runtime validation
        run: |
          npm run lint
          npm test -- -u
          npm run build
          npm run verify:syndrid
          cargo check --manifest-path rust/syndrid-ratatui-runtime/Cargo.toml --all-features
          cargo test --manifest-path rust/syndrid-ratatui-runtime/Cargo.toml --all-features
          npm run prepare:preview-sidecar

      - name: converge documentation and permanent CI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in [Path('README.md'), Path('AGENTS.md'), Path('CLAUDE.md'), Path('docs/CODEX.md'), Path('mcp-server/README.md'), Path('.claude/skills/tui-studio/SKILL.md'), Path('.claude/skills/stuidio-skill/SKILL.md')]:
              if not path.exists():
                  continue
              text = path.read_text()
              text = text.replace('node mcp-server/index.mjs', 'node --import ./mcp-server/bridge-auth-preload.mjs ./mcp-server/index.mjs')
              text = text.replace('node ./mcp-server/index.mjs', 'node --import ./mcp-server/bridge-auth-preload.mjs ./mcp-server/index.mjs')
              path.write_text(text)
          PY
          cat > docs/TERMINAL_TEST_MODE.md <<'DOC'
          # Terminal Test Mode

          Syndrid TUI Studio can run the current `.tui` v3 design through a real native terminal path before production implementation.

          `Studio .tui v3 -> resolved viewport/state/scenario -> syndrid-terminal-test/v1 -> Ratatui + TachyonFX -> native PTY/ConPTY -> xterm VT emulator`

          The bundled `syndrid-tui-preview` sidecar renders real Ratatui widgets and compiles authored TachyonFX DSL at runtime. Built-in deterministic scenarios cover Default, Empty, Loading, Loaded, Error, Offline, Slow Network, Large Dataset, and Unicode/Emoji. Custom fake-data/timeline scenarios persist in `.tui` v3 without mutating the authored tree.

          Controls include viewport, scenario, 0.25x-4x speed, reduced motion, loop, start position, fake data, hot reload, keyboard input and a debug overlay. Tab/Shift+Tab navigate focus, arrows navigate supported selection widgets, Enter activates controls, Ctrl+P pauses, Ctrl+R replays, Ctrl++/Ctrl+- adjust speed and Ctrl+Q exits.

          Test Mode shares the canonical motion and responsive resolvers used by save, MCP, motion export and implementation-spec generation. Hidden responsive nodes consume no layout space and all rectangles passed to Ratatui are integer terminal cells.
          DOC
          cat > docs/SECURITY.md <<'DOC'
          # Desktop and Agent-Bridge Security

          - Tauri uses explicit production/development CSPs.
          - The MCP browser bridge binds only to `127.0.0.1:5175` and requires a random per-user token plus an allowed local origin.
          - Bridge tokens are never stored in `.tui` files, MCP responses or source control.
          - Native preview specs are validated before the bundled sidecar launches and temporary spec files are removed with the PTY lifecycle.
          - PTY output is bounded and local image preview enforces supported extensions and a size limit.
          - Terminal commands start only from explicit user Run/Test actions, never ordinary Canvas rendering.
          DOC
          python - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text()
          marker = '## Unreleased - Studio hardening and Terminal Test Mode'
          if marker not in text:
              path.write_text(marker + '''\n\n- Unified TachyonFX preview/save/MCP/export discovery around one canonical resolver.\n- Added deep `.tui` v3 effect/ecosystem validation and canonical v3 autosave migration.\n- Fixed integer terminal-cell layout, hidden responsive children, and preview/matrix/warning resolver drift.\n- Preserved the complete Ratatui runtime-version map and unified generated Cargo guidance.\n- Added real Ratatui + TachyonFX Terminal Test Mode with deterministic fake data, interaction controls, reduced motion, hot reload, and a bundled native sidecar.\n- Added xterm VT emulation for faithful PTY cursor/alternate-screen rendering.\n- Fixed PTY natural-exit cleanup and temporary preview-spec lifecycle.\n- Added a restrictive Tauri CSP and token/origin-protected localhost MCP bridge.\n- Restored structural verification and a production dependency audit gate.\n\n''' + text)
          PY
          if [ -f scripts/bootstrap/ci-final.yml ]; then
            cp scripts/bootstrap/ci-final.yml .github/workflows/ci.yml
          fi

      - name: remove superseded convergence scaffolding
        shell: bash
        run: |
          rm -f .github/workflows/bootstrap-terminal-runtime.yml
          rm -f .github/workflows/finalize-studio-hardening.yml
          rm -f .github/workflows/finalize-studio-hardening-v2.yml
          rm -f .github/workflows/finalize-studio-hardening-push.yml
          rm -rf scripts/bootstrap

      - name: commit converged source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No convergence changes required."
          else
            git commit -m "chore: converge Studio hardening source"
            git push origin HEAD:${BRANCH}
          fi

  portable-exports:
    needs: converge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install textual
      - run: node scripts/generate-export-fixtures.mjs
      - name: verify generated Ratatui variants
        shell: bash
        run: |
          mkdir -p rust-check/src
          cp scripts/ci-templates/rust/Cargo.toml rust-check/Cargo.toml
          for f in ratatui ratatui-edge ratatui-edge-ansi16 ratatui-edge-ansi256; do
            cp "export-check/$f.rs" rust-check/src/main.rs
            cargo build --manifest-path rust-check/Cargo.toml
          done
      - name: verify Bubble Tea and Tview variants
        shell: bash
        run: |
          mkdir -p go-check
          cp scripts/ci-templates/bubbletea/view_test.go go-check/view_test.go
          cd go-check
          go mod init exportcheck
          cp ../export-check/bubbletea.go main.go
          go mod tidy
          for f in bubbletea bubbletea-edge bubbletea-edge-ansi16 bubbletea-edge-ansi256; do
            cp "../export-check/$f.go" main.go
            go test ./...
          done
          cd ..
          mkdir -p go-check-tview
          cd go-check-tview
          go mod init tviewcheck
          cp ../export-check/tview.go main.go
          go mod tidy
          for f in tview tview-edge tview-edge-ansi16 tview-edge-ansi256; do
            cp "../export-check/$f.go" main.go
            go build ./...
            go vet ./...
          done
      - name: verify Textual variants
        shell: bash
        run: |
          for f in textual textual-edge; do
            python -m py_compile "export-check/$f.py"
            python scripts/ci-templates/textual/smoke.py "export-check/$f.py"
          done
      - name: verify Blessed, OpenTUI and Ink variants
        shell: bash
        run: |
          for f in blessed blessed-edge blessed-edge-ansi16 blessed-edge-ansi256; do
            node --check "export-check/$f.js"
          done
          for f in opentui opentui-edge opentui-edge-ansi16 opentui-edge-ansi256 ink ink-edge ink-edge-ansi16 ink-edge-ansi256; do
            node_modules/.bin/esbuild "export-check/$f.tsx" --jsx=automatic --outfile=/dev/null
          done

  windows-desktop:
    needs: converge
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: build exact Windows sidecar
        run: npm run prepare:preview-sidecar:release
      - name: verify Tauri/PTTY linkage
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
      - name: build real NSIS desktop installer
        run: npm run desktop:build

  merge:
    needs: [converge, portable-exports, windows-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
      - name: remove final temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/converge-validate-merge.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove temporary convergence workflow"
            git push origin HEAD:${BRANCH}
          fi
      - name: mark PR ready and squash merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr ready ${PR_NUMBER} --repo ${{ github.repository }}
          gh pr merge ${PR_NUMBER} --repo ${{ github.repository }} --squash --delete-branch
