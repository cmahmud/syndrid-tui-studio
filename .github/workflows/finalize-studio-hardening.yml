name: Finalize Studio hardening branch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: converge audited frontend dependencies
        run: |
          npm install --package-lock-only
          npm audit fix --package-lock-only
          npm ci
          npm audit --omit=dev --audit-level=high

      - name: install xterm-backed test surface when bootstrap source remains
        shell: bash
        run: |
          if [ -f scripts/bootstrap/TerminalTestModal.tsx ]; then
            cp scripts/bootstrap/TerminalTestModal.tsx src/components/editor/TerminalTestModal.tsx
          fi

      - name: apply deterministic native-runtime compiler cleanups
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('rust/syndrid-ratatui-runtime/src/preview.rs')
          text = path.read_text()
          text = text.replace('#[derive(Debug)]\nstruct RuntimeState {', 'struct RuntimeState {')
          old = '''            let items = values.unwrap_or(&Vec::new()).iter().enumerate().map(|(item_index, value)| {
                let prefix = if item_index == selected { "› " } else { "  " };
                ListItem::new(format!("{prefix}{}", object_label(value)))
            }).collect::<Vec<_>>();'''
          new = '''            let empty_values = Vec::new();
            let source_values = values.unwrap_or(&empty_values);
            let items = source_values.iter().enumerate().map(|(item_index, value)| {
                let prefix = if item_index == selected { "› " } else { "  " };
                ListItem::new(format!("{prefix}{}", object_label(value)))
            }).collect::<Vec<_>>();'''
          text = text.replace(old, new)
          path.write_text(text)
          PY
          cargo fmt --manifest-path rust/syndrid-ratatui-runtime/Cargo.toml

      - name: frontend correctness gate
        run: |
          npm run lint
          npm test -- -u
          npm run build
          npm run verify:syndrid

      - name: real Ratatui and TachyonFX runtime gate
        run: |
          cargo check --manifest-path rust/syndrid-ratatui-runtime/Cargo.toml --all-features
          cargo test --manifest-path rust/syndrid-ratatui-runtime/Cargo.toml --all-features

      - name: build native preview sidecar
        run: npm run prepare:preview-sidecar

      - name: refresh MCP/docs launch instructions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'node mcp-server/index.mjs': 'node --import ./mcp-server/bridge-auth-preload.mjs ./mcp-server/index.mjs',
              'node ./mcp-server/index.mjs': 'node --import ./mcp-server/bridge-auth-preload.mjs ./mcp-server/index.mjs',
          }
          for path in [
              Path('README.md'), Path('AGENTS.md'), Path('CLAUDE.md'), Path('docs/CODEX.md'),
              Path('mcp-server/README.md'), Path('.claude/skills/tui-studio/SKILL.md'),
              Path('.claude/skills/stuidio-skill/SKILL.md'),
          ]:
              if not path.exists():
                  continue
              text = path.read_text()
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: write permanent Terminal Test Mode documentation
        shell: bash
        run: |
          cat > docs/TERMINAL_TEST_MODE.md <<'DOC'
          # Terminal Test Mode

          Syndrid TUI Studio can run the current `.tui` v3 design inside a real native terminal path before production implementation.

          ## Runtime path

          `Studio .tui v3 -> resolved viewport/state/scenario -> syndrid-terminal-test/v1 -> Ratatui + TachyonFX -> native PTY/ConPTY -> xterm VT emulator`

          The terminal surface is not the browser Canvas preview. The bundled `syndrid-tui-preview` console sidecar renders real Ratatui widgets and compiles authored TachyonFX DSL at runtime. Studio launches it through the same managed PTY layer used by terminal adapter previews, and xterm interprets the resulting VT/ANSI stream including cursor movement and alternate-screen redraws.

          ## Built-in deterministic scenarios

          - Default
          - Empty
          - Loading
          - Loaded
          - Error
          - Offline
          - Slow Network
          - Large Dataset
          - Unicode / Emoji

          Fake data is generated from a fixed scenario seed. Running the same scenario against the same design produces the same mock rows, list items, log events, sparkline samples, and initial state.

          Custom scenarios are persisted in the project portion of the `.tui` v3 file. They can override component props/visibility and define timestamped timeline changes without mutating the authored design tree.

          ## Controls

          Terminal Test Mode supports committed viewport selection, scenario selection, 0.25x-4x playback speed, reduced-motion mode, looping, start-position scrubbing, deterministic fake data, hot reload, keyboard input, and a runtime debug overlay.

          Inside the native test runtime:

          - `Tab` / `Shift+Tab`: focus navigation
          - arrows: list/select/table/tab navigation where supported
          - typing/backspace: text-input editing
          - `Enter`: activate/toggle the focused control
          - `Ctrl+P`: pause/resume
          - `Ctrl+R`: replay
          - `Ctrl++` / `Ctrl+-`: runtime speed adjustment
          - `Ctrl+Q`: exit the native preview process

          ## Source-of-truth guarantees

          Terminal Test Mode, MCP inspection, `.tui` persistence, motion export, responsive previews, and implementation-spec generation share the same canonical motion and responsive resolvers. Enabled legacy animation mirrors can rescue stale v3 mirrors during migration, but persisted/exported state is canonicalized back into structured v3 effects.

          Layout rectangles passed into the native runtime are integer terminal cells. Hidden responsive nodes are pruned before layout and therefore cannot consume flex/grid/stack gaps or create phantom overflow warnings.

          ## Limitations

          The runner is intended to validate terminal behavior, motion, loading/progress flows, responsive geometry, focus/input, and state scenarios before production implementation. Highly specialized adapters such as image protocols, nested PTYs, and application-specific business logic may still use authored fallbacks or mock content in the generic runner; their production adapter metadata remains in the `.tui` implementation spec.
          DOC

          cat > docs/SECURITY.md <<'DOC'
          # Desktop and Agent-Bridge Security

          Syndrid TUI Studio keeps native capabilities intentionally narrow.

          - The Tauri window uses an explicit production/development Content Security Policy instead of disabling CSP.
          - The MCP browser bridge binds only to `127.0.0.1:5175`.
          - WebSocket connections require a random per-user bridge token stored under the user's profile and compared with a timing-safe check.
          - The bridge rejects unexpected WebSocket origins and never logs the token.
          - The token is not stored in `.tui` projects, design specs, MCP responses, or source control.
          - The native terminal runner validates the portable test spec before spawning the bundled sidecar.
          - Preview spec files are temporary and removed when the PTY exits, is replaced, or Studio shuts down.
          - PTY output is bounded to prevent unbounded in-memory scrollback.
          - Local image preview accepts only supported image extensions and enforces a size limit.

          The terminal/PTY feature is inherently capable of executing commands configured by the user. Studio does not silently execute terminal components during ordinary Canvas rendering; explicit Run/Test actions own process creation.
          DOC

      - name: add hardening changelog entry once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text()
          marker = '## Unreleased - Studio hardening and Terminal Test Mode'
          if marker not in text:
              entry = '''## Unreleased - Studio hardening and Terminal Test Mode\n\n- Unified TachyonFX preview/save/MCP/export discovery around one canonical resolver.\n- Added deep `.tui` v3 effect/ecosystem validation and canonical v3 autosave migration.\n- Fixed integer terminal-cell layout, hidden responsive children, and preview/matrix/warning resolver drift.\n- Preserved the complete Ratatui runtime-version map and unified generated Cargo guidance.\n- Added real Ratatui + TachyonFX Terminal Test Mode with deterministic fake-data scenarios, interaction controls, reduced-motion playback, hot reload, and a bundled native sidecar.\n- Added xterm VT emulation for faithful PTY cursor/alternate-screen rendering in the desktop app.\n- Fixed PTY natural-exit cleanup and temporary preview-spec lifecycle.\n- Added a restrictive Tauri CSP and token/origin-protected localhost MCP bridge.\n- Restored structural verification and a production dependency audit gate.\n\n'''
              path.write_text(entry + text)
          PY

      - name: restore permanent read-only CI
        shell: bash
        run: |
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            push:
              branches: [main]
            pull_request:

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                - run: npm ci
                - name: reject high-severity production dependency advisories
                  run: npm audit --omit=dev --audit-level=high
                - run: npm run lint
                - run: npm test
                - run: npm run build
                - run: npm run verify:syndrid
                - run: node scripts/generate-export-fixtures.mjs
                - uses: actions/upload-artifact@v4
                  with:
                    name: export-check
                    path: export-check/

            verify-rust:
              needs: build
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/download-artifact@v4
                  with:
                    name: export-check
                    path: export-check
                - uses: dtolnay/rust-toolchain@stable
                - uses: Swatinem/rust-cache@v2
                  with:
                    workspaces: |
                      rust-check
                      rust/syndrid-ratatui-runtime
                - name: verify Syndrid Ratatui ecosystem and native terminal runtime
                  run: |
                    cargo check --manifest-path rust/syndrid-ratatui-runtime/Cargo.toml
                    cargo test --manifest-path rust/syndrid-ratatui-runtime/Cargo.toml
                    cargo check --manifest-path rust/syndrid-ratatui-runtime/Cargo.toml --all-features
                    cargo test --manifest-path rust/syndrid-ratatui-runtime/Cargo.toml --all-features
                - run: mkdir -p rust-check/src
                - run: cp scripts/ci-templates/rust/Cargo.toml rust-check/Cargo.toml
                - name: build each Ratatui variant
                  run: |
                    for f in ratatui ratatui-edge ratatui-edge-ansi16 ratatui-edge-ansi256; do
                      cp "export-check/$f.rs" rust-check/src/main.rs
                      cargo build --manifest-path rust-check/Cargo.toml
                    done

            verify-tauri-windows:
              needs: build
              runs-on: windows-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                - run: npm ci
                - uses: dtolnay/rust-toolchain@stable
                - uses: Swatinem/rust-cache@v2
                  with:
                    workspaces: |
                      rust/syndrid-ratatui-runtime
                      src-tauri
                - name: build the exact Windows terminal preview sidecar source
                  run: npm run prepare:preview-sidecar
                - name: verify sidecar target-triple artifact exists
                  shell: pwsh
                  run: |
                    $hostLine = (rustc -vV | Select-String '^host:').Line
                    $triple = ($hostLine -replace '^host:\s*', '').Trim()
                    $sidecar = "src-tauri/binaries/syndrid-tui-preview-$triple.exe"
                    if (-not (Test-Path $sidecar)) { throw "Missing prepared sidecar: $sidecar" }
                - name: verify Windows desktop, PTY, sidecar and ecosystem runtime linkage
                  run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

            verify-go:
              needs: build
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/download-artifact@v4
                  with:
                    name: export-check
                    path: export-check
                - uses: actions/setup-go@v5
                  with:
                    go-version: stable
                - run: mkdir -p go-check
                - run: cp scripts/ci-templates/bubbletea/view_test.go go-check/view_test.go
                - run: cp export-check/bubbletea.go go-check/main.go
                - working-directory: go-check
                  run: |
                    go mod init exportcheck
                    go mod tidy
                - name: test each Bubble Tea variant
                  working-directory: go-check
                  run: |
                    for f in bubbletea bubbletea-edge bubbletea-edge-ansi16 bubbletea-edge-ansi256; do
                      cp "../export-check/$f.go" main.go
                      go test ./...
                    done
                - run: mkdir -p go-check-tview
                - run: cp export-check/tview.go go-check-tview/main.go
                - working-directory: go-check-tview
                  run: |
                    go mod init tviewcheck
                    go mod tidy
                - name: build each Tview variant
                  working-directory: go-check-tview
                  run: |
                    for f in tview tview-edge tview-edge-ansi16 tview-edge-ansi256; do
                      cp "../export-check/$f.go" main.go
                      go build ./...
                      go vet ./...
                    done

            verify-python:
              needs: build
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/download-artifact@v4
                  with:
                    name: export-check
                    path: export-check
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                - run: pip install textual
                - name: compile + mount each Textual variant
                  run: |
                    for f in textual textual-edge; do
                      python -m py_compile "export-check/$f.py"
                      python scripts/ci-templates/textual/smoke.py "export-check/$f.py"
                    done

            verify-node-exports:
              needs: build
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/download-artifact@v4
                  with:
                    name: export-check
                    path: export-check
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                - run: npm ci
                - name: syntax-check each Blessed variant
                  run: |
                    for f in blessed blessed-edge blessed-edge-ansi16 blessed-edge-ansi256; do
                      node --check "export-check/$f.js"
                    done
                - name: syntax-check each OpenTUI/Ink variant
                  run: |
                    for f in opentui opentui-edge opentui-edge-ansi16 opentui-edge-ansi256 ink ink-edge ink-edge-ansi16 ink-edge-ansi256; do
                      node_modules/.bin/esbuild "export-check/$f.tsx" --jsx=automatic --outfile=/dev/null
                    done
          YAML

      - name: remove all bootstrap and self-mutating workflow scaffolding
        shell: bash
        run: |
          rm -f .github/workflows/bootstrap-terminal-runtime.yml
          rm -f .github/workflows/finalize-studio-hardening.yml
          rm -rf scripts/bootstrap

      - name: commit converged branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Branch already converged."
            exit 0
          fi
          git commit -m "chore: converge Studio hardening and terminal runtime"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
