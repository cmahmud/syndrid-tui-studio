name: Finalize Studio hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: reconcile lockfile and production audit
        run: |
          npm install --package-lock-only
          npm audit fix --package-lock-only
          npm ci
          npm audit --omit=dev --audit-level=high

      - name: install final xterm terminal surface
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('scripts/bootstrap/TerminalTestModal.tsx')
          text = source.read_text()
          marker = "  const durationMs = Math.max(100, selectedScenario.durationMs);\n"
          if 'const initialViewportRef = useRef(viewport);' not in text:
              text = text.replace(marker, marker + "  const initialViewportRef = useRef(viewport);\n")
          text = text.replace('cols: viewport.width,', 'cols: initialViewportRef.current.width,')
          text = text.replace('rows: viewport.height,', 'rows: initialViewportRef.current.height,')
          text = text.replace('disableStdin: !settings.interactive,', 'disableStdin: !interactiveRef.current,')
          source.write_text(text)
          Path('src/components/editor/TerminalTestModal.tsx').write_text(text)
          PY

      - name: converge native sidecar source
        shell: bash
        run: |
          rm -f src-tauri/src/bin/syndrid-tui-preview.rs
          rm -f scripts/prepare-preview-sidecar-v2.mjs
          python - <<'PY'
          from pathlib import Path
          path = Path('rust/syndrid-ratatui-runtime/src/preview.rs')
          text = path.read_text()
          text = text.replace('#[derive(Debug)]\nstruct RuntimeState {', 'struct RuntimeState {')
          old = '''            let items = values.unwrap_or(&Vec::new()).iter().enumerate().map(|(item_index, value)| {
                let prefix = if item_index == selected { "› " } else { "  " };
                ListItem::new(format!("{prefix}{}", object_label(value)))
            }).collect::<Vec<_>>();'''
          new = '''            let empty_values = Vec::new();
            let source_values = values.unwrap_or(&empty_values);
            let items = source_values.iter().enumerate().map(|(item_index, value)| {
                let prefix = if item_index == selected { "› " } else { "  " };
                ListItem::new(format!("{prefix}{}", object_label(value)))
            }).collect::<Vec<_>>();'''
          text = text.replace(old, new)
          path.write_text(text)
          PY
          cargo fmt --manifest-path rust/syndrid-ratatui-runtime/Cargo.toml

      - name: frontend correctness gate
        run: |
          npm run lint
          npm test -- -u
          npm run build
          npm run verify:syndrid

      - name: native Ratatui and TachyonFX gate
        run: |
          cargo check --manifest-path rust/syndrid-ratatui-runtime/Cargo.toml --all-features
          cargo test --manifest-path rust/syndrid-ratatui-runtime/Cargo.toml --all-features
          npm run prepare:preview-sidecar

      - name: write permanent runtime documentation
        shell: bash
        run: |
          cat > docs/TERMINAL_TEST_MODE.md <<'DOC'
          # Terminal Test Mode

          Syndrid TUI Studio can execute the current `.tui` v3 design through a real native terminal path before production implementation.

          `Studio .tui v3 -> canonical responsive/state/scenario resolver -> syndrid-terminal-test/v1 -> Ratatui + TachyonFX -> native PTY/ConPTY -> xterm VT emulator`

          The bundled `syndrid-tui-preview` console sidecar renders actual Ratatui widgets and compiles authored TachyonFX DSL at runtime. Built-in deterministic scenarios cover Default, Empty, Loading, Loaded, Error, Offline, Slow Network, Large Dataset, and Unicode/Emoji. Custom variables and timeline scenarios persist in `.tui` v3 without mutating the authored component tree.

          Controls include viewport, scenario, 0.25x-4x speed, reduced motion, loop, start position, deterministic fake data, hot reload, keyboard input, replay/pause, and a debug overlay. The runtime shares the same canonical responsive and authored-motion resolvers used by save, MCP, production motion export, and implementation-spec generation.

          Hidden responsive nodes consume no layout space. Geometry passed to Ratatui is quantized to integer terminal cells. The Studio surface uses xterm.js so cursor movement, alternate-screen redraws, colors, and fullscreen animation frames are interpreted as terminal control sequences rather than flattened HTML.
          DOC

          cat > docs/SECURITY.md <<'DOC'
          # Desktop and Agent-Bridge Security

          - Tauri uses explicit production and development content-security policies.
          - The Studio MCP browser bridge binds only to `127.0.0.1`.
          - A random per-user bridge token is stored outside `.tui` project files and attached by the desktop client.
          - The MCP preload validates the token with a timing-safe comparison and rejects untrusted WebSocket origins.
          - Secrets and bridge tokens are never serialized into portable design files.
          - PTY sessions and temporary preview specs are removed when the child exits or the Studio session is stopped.
          DOC

      - name: remove temporary non-workflow scaffolding
        shell: bash
        run: |
          rm -rf scripts/bootstrap

      - name: commit converged branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No convergence changes to commit."
            exit 0
          fi
          git commit -m "chore: finalize terminal runtime hardening"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
