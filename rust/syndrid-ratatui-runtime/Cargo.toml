[package]
name = "syndrid-ratatui-runtime"
version = "0.1.0"
description = "Version-coherent Ratatui ecosystem integration layer for Syndrid TUI Studio exports and previews"
edition = "2024"
rust-version = "1.88.0"
license = "MIT"
publish = false

[features]
default = ["desktop"]
desktop = [
    "ratatui/crossterm",
    "ratatui-textarea/crossterm",
    "ratatui-image/crossterm",
    "ratatui-image/image-defaults",
]
advanced = [
    "ratatui/unstable-rendered-line-info",
    "dep:tui-tree-widget",
    "dep:tui-widget-list",
    "dep:tui-term",
    "dep:ratatui-interact",
    "dep:tui-syntax-highlight",
    "dep:termprofile",
    "dep:tui-nodes",
    "dep:syntect",
]
embedded = ["dep:mousefood"]

[dependencies]
ratatui = { version = "0.30.2", default-features = false }
tachyonfx = { version = "0.25.1" }
ratatui-textarea = { version = "0.9.2", default-features = false, features = ["search", "serde"] }
tui-widgets = { version = "0.7.10", default-features = false, features = ["big-text", "cards", "popup", "prompts", "scrollbar", "scrollview"] }
ratatui-image = { version = "11.0.6", default-features = false, features = ["serde"] }
ansi-to-tui = "8.0.1"
mousefood = { version = "0.5.2", optional = true, default-features = false, features = ["std", "fonts", "framebuffer"] }
tui-tree-widget = { version = "0.24.1", optional = true, default-features = false }
tui-widget-list = { version = "0.15.3", optional = true }
tui-term = { version = "0.3.4", optional = true, features = ["unstable"] }
ratatui-interact = { version = "0.5.3", optional = true, default-features = false }
tui-syntax-highlight = { version = "0.2.0", optional = true, default-features = false, features = ["regex-fancy", "termprofile"] }
termprofile = { version = "0.2.4", optional = true, default-features = false, features = ["convert", "ratatui"] }
tui-nodes = { version = "0.10.0", optional = true }
syntect = { version = "5", optional = true, default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
